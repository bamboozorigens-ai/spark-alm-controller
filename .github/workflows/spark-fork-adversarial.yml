name: Spark ALM - ataques simulados em fork (391-393)

on:
  push:
    branches:
      - dev
    paths:
      - 'test/audit/pass39[1-3]_*.t.sol'
      - '.github/workflows/spark-fork-adversarial.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-adversarial-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adversarial-fork-only:
    name: Passos 391-393 - testes adversariais isolados
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
      FOUNDRY_PROFILE: default

    steps:
      - name: Checkout do codigo sem credenciais persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Instalar somente forge-std e suas dependencias
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive --depth 1 lib/forge-std

      - name: Instalar Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Verificar isolamento e impedir comandos de broadcast
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [
              Path("test/audit/pass391_fork_unauthorized_access.t.sol"),
              Path("test/audit/pass392_fork_susds_redemption.t.sol"),
              Path("test/audit/pass393_fork_v4_boundary_attacks.t.sol"),
          ]
          forbidden = [
              r'\bvm\.broadcast\s*\(',
              r'\bvm\.startBroadcast\s*\(',
              r'\bforge\s+script\b',
              r'\bcast\s+send\b',
              r'\beth_sendRawTransaction\b',
              r'\beth_sendTransaction\b',
          ]
          for path in paths:
              if not path.is_file():
                  raise SystemExit(f"Arquivo de teste ausente: {path}")
              contents = path.read_text(encoding="utf-8")
              for pattern in forbidden:
                  if re.search(pattern, contents):
                      raise SystemExit(f"BLOQUEADO: padrao proibido em {path}: {pattern}")
              if "vm.createSelectFork(" not in contents:
                  raise SystemExit(f"BLOQUEADO: teste nao inicializa fork local: {path}")
          print("Tres testes presentes, fork local confirmado, sem broadcasts declarados.")
          PY

      - name: Executar ataques 391-393 com logs individuais
        id: tests
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p audit-output
          failures=0
          for n in 391 392 393; do
            case "$n" in
              391) target="test/audit/pass391_fork_unauthorized_access.t.sol";;
              392) target="test/audit/pass392_fork_susds_redemption.t.sol";;
              393) target="test/audit/pass393_fork_v4_boundary_attacks.t.sol";;
            esac

            echo "===== PASSO $n: FORK LOCAL / SEM TRANSMISSAO ====="
            forge test --via-ir --match-path "$target" -vv \
              2>&1 | tee "audit-output/ci-pass$n-fork.log"
            result=${PIPESTATUS[0]}
            if [ "$result" -eq 0 ]; then
              status="PASSOU"
            else
              status="FALHOU ou INFRAESTRUTURA INCONCLUSIVA"
              failures=$((failures+1))
            fi

            printf "PASSO %s: %s (exit=%s)\n" "$n" "$status" "$result" \
              | tee -a "audit-output/pass391-393-results.txt"
            {
              echo "### Passo $n"
              echo ""
              echo "- Arquivo: $target"
              echo "- Status: $status"
              echo "- Exit code: $result"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done

          echo "Execucoes com falha ou inconclusivas: $failures"
          echo "Falha de teste NAO equivale a vulnerabilidade."
          exit "$failures"

      - name: Publicar logs de cada passo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-fork-391-393-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
